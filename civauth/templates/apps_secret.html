{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
  <div class="title">{{ name }}</div>
  <div class="credentials">
    <label class="credentials__label" for="client-id">Client id:</label>
    <input class="credentials__input" id="client-id" value="{{ client_id }}" readonly>
    <label class="credentials__label" for="client-secret">Client secret:</label>
    <input class="credentials__input" id="client-secret" value="{{ secret }}" readonly>
    <button type="button" class="button button--small" id="copy">Copy</button>
  </div>
  <div class="text">Copy the client secret now. It will not be shown later.</div>
  <div class="text">See <a href="{{ docs_url }}">the developer docs</a> for details on setting up your app.</div>
  <div class="actions"><a class="button" href="{{ apps_url }}">OAuth apps</a></div>
  <script nonce="{{ nonce }}">(function () {
var secret = document.getElementById("client-secret");
secret.addEventListener("focus", function () { secret.select(); });
var b = document.getElementById("copy");
b.addEventListener("click", function () {
  navigator.clipboard.writeText(secret.value).then(function () {
    b.textContent = "Copied"; b.classList.add("button--done");
    setTimeout(function () { b.textContent = "Copy"; b.classList.remove("button--done"); }, 1500);
  });
});
})();
  </script>
{% endblock %}

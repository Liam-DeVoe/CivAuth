{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block body %}
  <div class="title">{{ name }}</div>
  <div class="text">Client id: <span class="code">{{ client_id }}</span></div>
  <div class="text">Client secret (copy now, will not be shown later):</div>
  <span class="secret">{{ secret }}</span>
  <div class="actions"><a class="button" href="{{ apps_url }}">OAuth apps</a></div>
{% endblock %}

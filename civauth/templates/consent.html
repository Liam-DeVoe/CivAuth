{% extends "card.html" %}
{% from "macros.html" import app_request, brand with context %}
{% block title %}Authorize {{ app_name }}{% endblock %}
{% block card %}
  {{ app_request(app_name, owner_name) }}
  <form method="post" action="{{ url('/oauth/authorize') }}">
    <input type="hidden" name="method" value="consent">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <div class="consent__who">
      <div class="consent__person">
        <img class="consent__avatar"
             src="{{ url('/avatar/' ~ account.uuid ~ '.png') }}"
             width="32"
             height="32"
             alt="">
        <span class="strong">{{ account.name }}</span>
      </div>
      <button type="submit" name="decision" value="switch" class="button button--quiet">Not you?</button>
    </div>
    <div class="consent__foot">
      <button type="submit" name="decision" value="allow" class="button">Authorize</button>
      <button type="submit" name="decision" value="deny" class="button button--danger">Cancel</button>
      {{ brand() }}
    </div>
  </form>
{% endblock %}
